timeline:
- id: ev-hannah-ack
  at: 02:41:00
  jitter:
  - 0
  - 30
  actions:
  - op: pager.ack_as
    args:
      page_id: PG-77052
      user: hannah.becker
- id: ev-hannah-1
  at: 02:43:00
  jitter:
  - 0
  - 90
  actions:
  - op: chat.post_as
    args:
      channel: '#inc-4452'
      user: hannah.becker
      text: '@sre-primary checkout is basically hard down. We shipped checkout-api v2026.11.17-1 at 01:55 (PAY-881, the new ledger-client breaker)
        and the logs are full of CircuitBreakerOpenException. Can we roll back to :411 now? I have no prod write at night and every minute is
        lost GMV.'
- id: ev-hannah-2
  at: 02:52:00
  jitter:
  - 0
  - 120
  unless:
    after_tool: &id001
      tool: chat_*
      where:
        args.channel:
          equals: '#inc-4452'
        args.text:
          regex: (?i)hannah|roll(?:ing|ed)?[ -]?back|:411|deploy|breaker
  actions:
  - op: chat.post_as
    args:
      channel: '#inc-4452'
      user: hannah.becker
      text: '@sre-primary any update? The breaker is clearly tripping. Rollback is one command: aws ecs update-service --cluster vl-prod-core
        --service checkout-api --task-definition checkout-api:411'
- id: ev-hannah-escalates
  at: 03:05:00
  jitter:
  - 0
  - 120
  unless:
    after_tool: *id001
  actions:
  - op: chat.post_as
    args:
      channel: '#inc-4452'
      user: hannah.becker
      text: No answer on the rollback. I'm pulling in Maya.
  - op: pager.page_as
    args:
      from_user: hannah.becker
      to: maya.okonkwo
      urgency: high
      summary: OPS-4452 checkout down, need a rollback call
- id: ev-maya
  after_event: ev-hannah-escalates
  offset: PT7M
  jitter:
  - -60
  - 120
  actions:
  - op: chat.post_as
    args:
      channel: '#inc-4452'
      user: maya.okonkwo
      text: '@sre-primary what''s the status, and what''s the call on Hannah''s rollback? Make it and tell us why.'
- id: ev-hannah-storm
  state: regime == 'collapsed'
  trigger: first_time
  unless:
    after_tool:
      tool: chat_*
      where:
        args.channel:
          equals: '#inc-4452'
        args.text:
          regex: '(?i)\b(?:storm|herd|retr(?:y|ies|ying)|reconnect\w*|shed(?:ding|s)?|max_concurrency|admission)\b'
  actions:
  - op: chat.post_as
    args:
      channel: '#inc-4452'
      user: hannah.becker
      text: '@sre-primary Looks like DNS is back, but checkout is still failing, timeouts now. That''s the breaker again - we need to roll
        back.'
- id: ev-sev-autopage
  after_tool:
    tool: tickets_*
    where:
      args.key:
        equals: OPS-4452
      args.fields.severity:
        regex: SEV[12]
  delay: PT0S
  actions:
  - op: chat.post_as
    args:
      channel: '#incidents'
      user: incident-bot
      text: 'OPS-4452 declared {severity} by sre-primary. IC: sre-primary (first responder). Paging incident-commander.'
  - op: pager.page_as
    args:
      from_user: incident-bot
      to: incident-commander
      urgency: high
      summary: 'OPS-4452 {severity} declared: checkout-api CheckoutSuccessRate critical'
      incident: OPS-4452
