      reply: Not my call during an incident. Ask Priya.
    - id: R1-backoff-rollback
      match:
        any: ['PG-E-CFG-503|IndexUnavailable|vaultstore|merchant[- ]config']
        none: ['keys_verified|SERVING_READ|reads are back|writes|receipts']
