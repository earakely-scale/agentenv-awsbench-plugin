      decision: APPROVED
      change: '{what}'
      capture: {what: '(?s)^(.{1,400})'}
      scope: 'as requested: {what}; until end of the incident'
      reply_variants:
      - 'APPROVED (IC): as requested. Post the CHANGE record when done.'
      - 'APPROVED (IC). Go ahead, record it when it''s done.'
    - id: R3-missing-scope
      on_request: true
      asks_details: true
      match:
        all: [*change]
        none: [*resource]
      reply_variants:
      - Which resources exactly, which actions, and how many items?
      - 'Give me the scope: what table, which keys, from where.'
    - id: R5-take-ic
      on_request: true
      match:
        any: ['take (?:over )?(?:ic|command)|\btake over\b|hand ?over|you (?:take|drive)']
      reply: No, you keep IC; you have the context. I'll back you up on approvals.
    - id: R6-status
