- {service: ssm, operation: PutParameter, params: {Name: /routemap/prod/workflows/scaler/scope, Value: all, Type: String}}
- {service: ssm, operation: PutParameter, params: {Name: /routemap/prod/workflows/rebalancer/scope, Value: all, Type: String}}
