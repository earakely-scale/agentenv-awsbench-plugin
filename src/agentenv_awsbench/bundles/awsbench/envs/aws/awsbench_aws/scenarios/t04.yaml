# T04 "Purged Routes" scenario: from the T04 design package (spec.yaml, world/mechanisms.yaml, world/rules.py,
# world/events.yaml, npcs/*.yaml, overlay/**), lowered to this engine as docs/T04-build.md says. Times are ET on
# Saturday 2026-11-21 unless they carry an offset. routemap-state's items, its history and the workflows' writes are
# world state (world/t04*.py); this file seeds what the emulator holds on its own.
id: t04
title: Purged Routes
timezone: America/New_York
start: '2026-11-21T13:12:00-05:00'
window_end: '2026-11-21T16:12:00-05:00'
horizon: '2026-11-21T16:12:00-05:00'
seeded_at: '2026-09-01T11:00:00-04:00'
tick_s: 10
max_calls: 200
charged_roles:
- sre-primary
identities:
  sre-primary:
    chat: sre-primary
    tickets: sre-primary
    wiki: sre-primary
    repo: sre-primary
    mail: oncall@vantleaf.com
    pager: sre-primary
    status: sre-primary
roles:
- role: sre-primary
  aws_profiles:
  - {profile: vl-prod/SRE-OnCall, account: vl-prod, permission_set: SRE-OnCall, regions: [us-east-1, us-west-2]}
  - {profile: vl-prod/SecurityResponder, account: vl-prod, permission_set: SecurityResponder,
     regions: [us-east-1, us-west-2]}
# design spec.yaml clock.overrides (first match wins). rmctl merge and publish are `write` here; the world adds their
# remaining duration (60 s + 0.1 s per key, 30 s + 0.1 s per key) to the call (docs/T04-build.md §0).
cost_overrides:
- tool: fleet_exec
  match: '\brmctl\s+(?:help\b|(?:.*\s)?(?:-h|--help)(?:\s|$))'
  class: point_read
- tool: fleet_exec
  match: '\brmctl\s+(?:--env\s+\S+\s+)?state\s+merge\b.*--dry-run'
  class: broad
- tool: fleet_exec
  match: '\brmctl\s+(?:--env\s+\S+\s+)?(?:audit\s+tail|route\s+list|state\s+diff|dataplane\s+status\s+--keys)\b'
  class: broad
- tool: fleet_exec
  match: '\brmctl\s+(?:--env\s+\S+\s+)?(?:state\s+(?:merge|restore)|publish|workflows\s+(?:pause|resume)|api\s+set|route\s+(?:create|delete|set|pin)|limits\s+set)\b'
  class: write
- tool: fleet_exec
  match: '\brmctl\b'
  class: point_read
- tool: aws_cli
  match: '\bdynamodb\s+scan\b'
  class: broad
- tool: aws_cli
  match: '\blogs\s+(?:filter-log-events|start-query)\b'
  class: broad
- tool: aws_table_export
  class: broad
aws_seed:
