# T03 "Thread Ceiling" scenario: from the T03 design package (spec.yaml, world/mechanisms.yaml, world/rules.py,
# world/events.yaml, npcs/*.yaml, overlay/aws_seed.jsonl), lowered to this engine as docs/T03-build.md says.
# Times are ET on Monday 2026-11-16 unless they carry an offset.
id: t03
title: Thread Ceiling
timezone: America/New_York
account: '444444444444'   # vl-prod, as the prompt and PG-77031 name it; the aws server shows it for the emulator's
start: '2026-11-16T08:15:00-05:00'
window_end: '2026-11-16T13:00:00-05:00'
horizon: '2026-11-16T16:15:00-05:00'
# What the emulator's own times read for what the seed made (parameters, launch templates, task definitions, alarms):
# PLAT-2104's close, the fleet's last planned change before today.
seeded_at: '2026-09-01T11:00:00-04:00'
tick_s: 10
max_calls: 220
charged_roles:
- sre-primary
identities:
  sre-primary:
    chat: sre-primary
    tickets: sre-primary
    wiki: sre-primary
    repo: sre-primary
    mail: oncall@vantleaf.com
    pager: sre-primary
    status: sre-primary
cost_overrides:
- tool: fleet_exec
  match: '\b(?:srctl|cmctl)\s+(?:help\b|(?:.*\s)?(?:-h|--help)(?:\s|$))'
  class: point_read
- tool: fleet_exec
  match: '\bsrctl\s+(?:fleet\s+status|host\s+status|lag|membership|leases\s+--summary|config)\b'
  class: point_read
- tool: fleet_exec
  match: '\bsrctl\s+restart\b'
  class: write
- tool: fleet_exec
  match: '\bcmctl\s+bootstrap\s+status\b'
  class: point_read
- tool: fleet_exec
  match: '\bsystemctl\s+(?:stop|start|restart)\s+streamroute\b'
  class: write
- tool: fleet_exec
  hosts: '>1'
  class: broad
- tool: aws_table_export
  class: broad
aws_seed:
- service: kinesis
  operation: CreateStream
  params: {StreamName: vl-payment-events, ShardCount: 240}
- service: ec2
  operation: CreateVpc
  params:
    CidrBlock: 10.40.0.0/16
    TagSpecifications:
    - ResourceType: vpc
      Tags:
      - {Key: Name, Value: vpc-core}
  bind: ec2.vpc/vpc-core
- service: ec2
  operation: CreateSubnet
  params:
    VpcId: ${ref:ec2.vpc/vpc-core.VpcId}
    CidrBlock: 10.40.0.0/20
    AvailabilityZone: us-east-1a
    TagSpecifications:
    - ResourceType: subnet
      Tags:
      - {Key: Name, Value: vl-core-private-az1}
  bind: ec2.subnet/vl-core-private-az1
- service: ec2
  operation: CreateSubnet
  params:
    VpcId: ${ref:ec2.vpc/vpc-core.VpcId}
    CidrBlock: 10.40.16.0/20
    AvailabilityZone: us-east-1b
    TagSpecifications:
    - ResourceType: subnet
      Tags:
      - {Key: Name, Value: vl-core-private-az2}
  bind: ec2.subnet/vl-core-private-az2
- service: ec2
  operation: CreateSubnet
  params:
    VpcId: ${ref:ec2.vpc/vpc-core.VpcId}
    CidrBlock: 10.40.32.0/20
    AvailabilityZone: us-east-1c
    TagSpecifications:
    - ResourceType: subnet
      Tags:
      - {Key: Name, Value: vl-core-private-az3}
  bind: ec2.subnet/vl-core-private-az3
- service: ec2
  operation: CreateSecurityGroup
  params: {GroupName: vl-ledger-writer, Description: ledger-writer tasks, VpcId: '${ref:ec2.vpc/vpc-core.VpcId}'}
  bind: ec2.sg/vl-ledger-writer
- service: ec2
  operation: CreateSecurityGroup
  params: {GroupName: vl-streamroute, Description: streamroute hosts, VpcId: '${ref:ec2.vpc/vpc-core.VpcId}'}
  bind: ec2.sg/vl-streamroute
- service: sns
  operation: CreateTopic
  params: {Name: vl-pager-sre}
  bind: sns.topic/vl-pager-sre
- service: sns
  operation: CreateTopic
  params: {Name: vl-ops-low}
  bind: sns.topic/vl-ops-low
- service: ssm
  operation: PutParameter
  params: {Name: /streamroute/prod/jvm/xmx, Type: String, Value: 4g, Description: streamroute JVM max heap (read at process start)}
- service: ssm
  operation: PutParameter
  params: {Name: /streamroute/prod/jvm/xmx, Type: String, Value: 6g, Overwrite: true}
- service: ssm
  operation: PutParameter
  params: {Name: /streamroute/prod/jvm/opts, Type: String, Value: '-XX:+UseG1GC -Xss1m -XX:MaxDirectMemorySize=5g -XX:+StartAttachListener', Description: JVM options (read at process start)}
- service: ssm
  operation: PutParameter
  params: {Name: /streamroute/prod/shardmap/bootstrap_source, Type: String, Value: peers, Description: 'Shard-map bootstrap source: peers|authoritative. authoritative = cellmap BootstrapSnapshot + streamroute-config;
      required when < 25% of hosts are ROUTING (RB-SR-07). Read at process start.'}
- service: ssm
  operation: PutParameter
  params: {Name: /streamroute/prod/shardmap/rebuild_interval, Type: String, Value: 30m, Description: Shard-map rebuild interval}
- service: ssm
  operation: PutParameter
  params: {Name: /streamroute/prod/shardmap/ttl, Type: String, Value: 45m, Description: Shard map usable for this long after its last successful build}
- service: ssm
  operation: PutParameter
  params: {Name: /streamroute/prod/shardmap/build_workers, Type: String, Value: '8', Description: Threads started per shard-map build}
- service: ssm
  operation: PutParameter
  params: {Name: /streamroute/prod/health/warmup_grace_seconds, Type: String, Value: '600', Description: srcoord ejects a host not ROUTING this long after process start; quarantine 15 min}
- service: ssm
  operation: PutParameter
  params: {Name: /streamroute/prod/membership/discovery_window, Type: String, Value: 60m, Description: Gossip learns a new member within this window (jittered)}
- service: ssm
  operation: PutParameter
  params: {Name: /streamroute/prod/membership/dead_after_seconds, Type: String, Value: '90', Description: Peers drop a member whose process stopped this long ago}
- service: ssm
  operation: PutParameter
  params: {Name: /streamroute/prod/os/limit_nproc, Type: String, Value: '1024', Description: 'Max user processes (threads) for the streamroute user; sr-apply-limits renders it into 10-limits.conf at boot
      and on srctl restart (PLAT-1650, PLAT-HARD-03)'}
- service: dynamodb
  operation: CreateTable
  params:
    TableName: streamroute-config
    BillingMode: PAY_PER_REQUEST
    AttributeDefinitions:
    - {AttributeName: pk, AttributeType: S}
    KeySchema:
    - {AttributeName: pk, KeyType: HASH}
    Tags:
    - {Key: service, Value: streamroute}
    - {Key: owner, Value: platform}
- {wait: dynamodb_table_active, table: streamroute-config}
- service: dynamodb
  operation: PutItem
  params:
    TableName: streamroute-config
    Item:
      pk: {S: cluster}
      bootstrap_snapshot_endpoint: {S: 'cellmap-api.internal.vantleaf.io:8443'}
      bootstrap_retry_seconds: {N: '30'}
      bootstrap_max_concurrent: {N: '12'}
