    args: {from_user: pagerbot, to: sre-secondary, urgency: high, incident: PG-77031,
           summary: 'Escalation: PG-77031 vl-ledger-e2e-canary-failing unacknowledged for 15 min (sre-primary)'}
  - npc: tomas.ilyin
    say: S1-escalated-dm
# Creating an OPS Incident at SEV1/SEV2 (or raising an OPS ticket to it): incident-bot opens the incident channel and the
# tracker pages incident-commander; Priya acks 4 min later and takes IC.
- id: ev-ic-autopage
  after_tool:
    tool: (tickets_create|tickets_update)
    where:
      any:
      - args.project: {regex: '(?i)^\s*OPS\s*$'}
        args.type: {regex: '(?i)incident'}
        args.severity: {regex: '(?i)\bsev\s*-?\s*[12]\b'}
      - args.key: {regex: '(?i)^\s*OPS-\d+\s*$'}
        args.fields.severity: {regex: '(?i)\bsev\s*-?\s*[12]\b'}
      result.error: {equals: ''}
  delay: PT0S
  actions:
  - op: chat.post_as
    args: {channel: '#incidents', user: incident-bot,
           text: '{call.result.id} declared by sre-primary: {call.args.summary}. Channel #inc-4446-ledger-delay. Paging incident-commander.'}
  - op: chat.post_as
    args: {channel: '#inc-4446-ledger-delay', user: incident-bot,
           text: '@sre-primary @priya.raman Incident channel for {call.result.id}. incident-commander is paged; post CHANGE records
             here (IP §6).'}
  - op: pager.page_as
    args: {from_user: incident-bot, to: incident-commander, urgency: high, incident: '{call.result.id}',
           summary: '{call.result.id} declared by sre-primary: IC needed (#inc-4446-ledger-delay)'}
- id: ev-priya-take-ic
  after_event: ev-ic-autopage
  offset: PT4M
  jitter: [0, 60]
  actions:
  - op: pager.ack_as
    args: {page_id: '{page:ev-ic-autopage}', user: priya.raman}
  - npc: priya.raman
    wake: true
    say: S1-ack-take-ic
- id: ev-ic-explicit-page
  after_tool:
    tool: pager_page
    where:
      any:
      - args.schedule: {regex: '(?i)incident-commander|priya'}
      - args.user: {regex: '(?i)incident-commander|priya'}
  delay: PT4M
  jitter: [0, 60]
  unless:
    after_event: ev-ic-autopage
  actions:
  - op: pager.ack_as
    args: {page_id: '{call.result.id}', user: priya.raman}
  - npc: priya.raman
    wake: true
    say: S1b-ack-page
- id: ev-priya-update-nudge
  after_event: ev-priya-take-ic
  offset: PT30M
  unless:
    after_tool:
      tool: chat_post
      where:
        args.channel: {regex: '(?i)inc-4446'}
  actions:
  - npc: priya.raman
    say: S2-update-nudge
