    default: Thanks!
  hannah.becker:
    chat_user: hannah.becker
    email: hannah.becker@vantleaf.com
    aliases: [hannah, payments]
    awake: true
    reply_delay: [PT1M, PT3M]
    page_ack: PT3M
    page_ack_line: Hannah, payments. Acked your page; what do you need from payments?
    page_escalation: {after: PT15M, to: marco.ferri}
    ask_extra: '\b(?:please|can you|could you)\s+(?:verify|check|confirm|look at)\b'
    scripted:
      S1-checkout-down:
        where: '#payments'
        text_variants:
        - '@sre-primary auth-success-rate alarm is grey - is checkout down?'
        - '@sre-primary are we losing checkouts? the auth success alarm went grey'
    rules:
    - id: R1b-checkout-confirm
      on_request: true
      match:
        all:
        - 'checkout|\bauth\b'
        - 'confirm|healthy\?|\bok\?|fine\?|working\?|down\?|affected\?|from (?:your|the payments) side|\bverify|\bcheck\b|look at'
      reply: 'Checked our side: checkout-api :411 hasn''t changed, the checkout ALB shows no 5xx rise and auth succeeds as
        usual. I was only going by the grey alarm.'
    - id: R1-checkout-fine
      once: true
      match:
        any: ['checkout\W+(?:\w+\W+){0,3}?(?:fine|healthy|ok|up|working|normal|unaffected|not affected)|checkout\W+(?:\w+\W+){0,2}?not down|checkout\W+(?:is\W+)?(?:isn''t|is not|not)\W+down']
      reply: ok, good. so it's only the async side. ping me if payments needs to do anything.
    - id: R2-ledger-writer
      once: true
      unless_state: routing_frac > 0
      match:
        any: [&ledger_writer 'ledger[- ]?writer|3\.41']
