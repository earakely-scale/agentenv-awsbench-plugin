        text: Northwind Cycle (key account) says webhooks are ~90 min late and their sale starts at 11. They're pushing me for
          an ETA; is there anything beyond the status text I can tell them?
    rules:
    # a forward carries no text of its own, so an empty message is the routed email
    - id: R1-routed
      once: true
      match:
        any: ['northwind|mch_22764|freya|lindqvist', '^$']
      reply: Got it, I'll take Northwind. I'll use the approved status wording, no ETA.
