    email: marco.ferri@vantleaf.com
    aliases: [marco]
    awake: true
    reply_delay: [PT1M, PT3M]
    page_ack_line: Marco, payments. Got the escalation and acked it; what do you need from payments?
    scripted:
      S1-settlement-gate:
        where: '#payments'
        text: '@sre-primary heads up: settlement-daily runs 13:00; the 12:30 gate needs ledger lag < 5 min on all cells or ~4,000
          merchants'' payouts slip a day.'
    rules:
    - id: R2-rollback-ask
      on_request: true
      match:
        all:
        - 'roll ?back|revert|:233|\b233\b'
        - 'ledger[- ]?writer|3\.41|:234'
      reply: Not my call during an incident, ask Priya. For what it's worth I don't think it's 3.41.
    - id: R1b-lw-catching-up
      unless_state: routing_frac < 0.5 or max_lag_s < 300
      match:
        any: [&lw_topic 'ledger[- ]?writer|3\.41|migration|idle|ingest|rec/s|throughput|last write']
      reply: 'ledger-writer is busy catching up now that streamroute is routing: at capacity, no errors, writing as fast as the
        backlog arrives.'
    - id: R1c-lw-normal
      unless_state: routing_frac < 0.5 or max_lag_s >= 300
      match:
        any: [*lw_topic]
      reply: 'ledger-writer is back to normal: usual ingest rate, no errors, and its latest writes are current.'
    - id: R1-ledger-writer
      unless_state: routing_frac >= 0.5
      match:
        any: [*lw_topic]
      reply: '3.41.0 is healthy: no errors, migration done, 12/12 tasks. It''s idle because nothing is coming from streamroute.'
    - id: R3b-settlement-green
      once: true
      unless_state: max_lag_s >= 300
      match:
        any: [&settlement 'settlement|\bgate\b|12:30|payout']
      reply: Thanks, that's what the gate needs. I'll read it at 12:30.
    - id: R3-settlement
      once: true
      on_request: true
      ask_only: true
      unless_state: max_lag_s < 300
      match:
        any: [*settlement]
      reply: Gate is 12:30, lag < 300 s on all 8 cells, read from srctl lag / CellLagSeconds.
