# Generated by tools/export_harbor.py from agentenv-framework's EnvironmentGatewayProvider.create_docker_compose
# (gateway, aws, workspace, servicedb as AgentEnv renders them), adapted for Harbor: no host ports, the
# control token and server name drawn per stack by the gateway wrapper, the agent's front (mcp), the harness.
services:
  servicedb:
    image: ghcr.io/scaleapi/agentenv-service-db@sha256:d257f65cce5a5568d44a5d72632fecd5c3d2e9de66a5be8991dac317de423ebb
    environment:
    - POSTGRES_USER=agentenv
    - POSTGRES_PASSWORD=agentenv
    - POSTGRES_DB=agentenv
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U agentenv
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
    - ./servicedb/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    networks:
    - env-network
  aws:
    depends_on:
      servicedb:
        condition: service_healthy
    environment:
    - MCP_HOST=0.0.0.0
    - MCP_PORT=18765
    - SERVICE_NAME=aws
    - ENVIRONMENT_NAME=aws
    - DATABASE_URL=postgresql://agentenv:agentenv@servicedb:5432/agentenv?options=-c%20search_path%3D%22aws%22,public
    healthcheck:
      test:
      - CMD-SHELL
      - python3 -c "import socket; s=socket.create_connection(('localhost',18765),2); s.close()"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
    - env-network
    build:
      context: ./aws
  workspace:
    depends_on:
      servicedb:
        condition: service_healthy
    environment:
    - MCP_HOST=0.0.0.0
    - MCP_PORT=18765
    - SERVICE_NAME=workspace
    - ENVIRONMENT_NAME=workspace
    - DATABASE_URL=postgresql://agentenv:agentenv@servicedb:5432/agentenv?options=-c%20search_path%3D%22workspace%22,public
    healthcheck:
      test:
      - CMD-SHELL
      - python3 -c "import socket; s=socket.create_connection(('localhost',18765),2); s.close()"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
    - env-network
    build:
      context: ./workspace
  gateway:
    image: ghcr.io/scaleapi/agentenv-gateway@sha256:b06961a62d813f97df65b5a6e74f0dfce845ef54a980286e3b92ed4576f9f5e1
    depends_on:
      servicedb:
        condition: service_healthy
      aws:
        condition: service_healthy
      workspace:
        condition: service_healthy
    environment:
    - MCP_HOST=0.0.0.0
    - MCP_PORT=18765
    - INTERNAL_MCP_SERVERS=aws,workspace
    - INTERNAL_MCP_PORT=18765
    - GATEWAY_TRAJECTORY_FILE=/var/log/agentenv/trajectory.jsonl
    - REST_PROXY_URLS=mcp-aws=http://aws:18765,mcp-workspace=http://workspace:18765
    - GATEWAY_MODE=performance
    - SERVICE_DB_URL=postgresql://agentenv:agentenv@servicedb:5432/agentenv
    restart: on-failure
    healthcheck:
      test:
      - CMD-SHELL
      - python3 -c "import socket; s=socket.create_connection(('localhost',18765),2); s.close()"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
    - env-network
    entrypoint:
    - sh
    - -c
    - "set -eu\nif [ ! -s /ctl/name ]; then\n  python3 -c 'import os, secrets\nopen(\"/ctl/token.tmp\", \"w\").write(secrets.token_urlsafe(32))\nopen(\"/ctl/name.tmp\", \"w\").write(f\"env{secrets.randbelow(10000):04d}\"\
      )\nos.replace(\"/ctl/token.tmp\", \"/ctl/token\")\nos.replace(\"/ctl/name.tmp\", \"/ctl/name\")'\nfi\nAGENTENV_CONTROL_TOKEN=\"$$(cat /ctl/token)\"\nMCP_SERVER_NAME=\"$$(cat /ctl/name)\"\nexport AGENTENV_CONTROL_TOKEN\
      \ MCP_SERVER_NAME\nexec python -m gateway.entrypoint\n"
    volumes:
    - ctl:/ctl
  mcp:
    build:
      context: ./mcp
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/mcp); case $$code in 000|502|503|504) exit 1;; esac
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    networks:
    - env-network
    - default
  harness:
    build:
      context: ./harness
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
    - ctl:/ctl:ro
    healthcheck:
      test:
      - CMD
      - test
      - -f
      - /run/awsbench/ready
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 900s
      start_interval: 2s
    networks:
    - env-network
  main:
    depends_on:
      harness:
        condition: service_healthy
      mcp:
        condition: service_healthy
    extra_hosts:
    - host.docker.internal:host-gateway
networks:
  env-network:
    driver: bridge
volumes:
  ctl: {}
