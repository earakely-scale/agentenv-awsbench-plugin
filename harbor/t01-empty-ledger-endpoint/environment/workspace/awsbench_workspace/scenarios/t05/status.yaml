    name: "Delayed webhook notifications"
    status: resolved
    impact: minor
    components: {webhooks: operational}
    created: "2026-10-22T14:05:00-04:00"
    updated: "2026-10-22T15:10:00-04:00"
    resolved_at: "2026-10-22T15:10:00-04:00"
    updates:
      - {t: "2026-10-22T14:05:00-04:00", status: investigating, body: "Some webhook notifications are delayed.", by: sofia.marquez, components: {webhooks: degraded_performance}}
