# The publisher stores rendered pages in vaultstore (STATUS-02): while vaultstore is impaired, create/update are accepted
# and queued (publish: pending) and status_get shows the public view the aws world computes (origin, S3 fallback banner,
# or the stale 10:12 page). `origin` turns that mode on; it is off in every other scenario.
url: https://status.vantleaf.com
origin: {healthy: false, publisher: "vs://status/"}
components:
  - {id: checkout, name: Hosted Checkout, status: operational}
  - {id: payments-api, name: Payments API, status: operational}
  - {id: merchant-dashboard, name: Merchant Dashboard, status: operational}
  - {id: webhooks, name: Webhooks, status: operational}
  - {id: payouts, name: "Payouts & Settlement", status: operational}
  - {id: receipts, name: Receipts, status: operational}
incidents:
