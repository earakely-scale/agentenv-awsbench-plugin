# The agent's only way into the env: the gateway's MCP endpoint, as the role the task deploys the agent as. Every other
# gateway route (the control routes, /step, /state, /clock, /svc, the exports) answers 404 here.
worker_processes 1;
events { worker_connections 1024; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_max_body_size 32m;
  server {
    listen 18765;
    location = /mcp {
      proxy_pass http://gateway:18765;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header AgentEnv-Role {role};
      proxy_set_header Authorization "";
      proxy_buffering off;
      proxy_cache off;
      proxy_request_buffering off;
      proxy_read_timeout 6h;
      proxy_send_timeout 6h;
    }
    location / { return 404; }
  }
}
